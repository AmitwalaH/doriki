name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Branch protection on main requires the status check named exactly "gate".
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (DESIGN.md section 10.3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # The same target developers run, so CI and a local gate cannot drift apart.
      - run: make gate
