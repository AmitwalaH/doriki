name: Pack request or capture
description: Ask for an engine or version doriki does not parse yet, ideally with a real startup capture.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        doriki's parser packs are written only from real captures, never from memory, so a
        capture of one real startup is what makes support possible. Right after the pod becomes
        Ready (Kubernetes keeps events for about an hour), with doriki v0.1.0-rc.2 or newer:

        ```sh
        doriki capture pod/<pod> -n <ns> --out <dir> --redact-level strict
        ```

        `capture` removes secrets and hashes names, and its `SOURCE.md` says what it removed.
        Read `container.log` yourself before attaching: a secret the engine prints with no
        known token shape stays. GitHub does not take folders, so zip the directory
        (`zip -r <dir>.zip <dir>`) and attach the zip below.
        [docs/fixtures.md](https://github.com/AmitwalaH/doriki/blob/main/docs/fixtures.md)
        shows how a bundle becomes a fixture.

        **With a doriki older than rc.2 or no doriki at all**, save the three files with
        kubectl instead:

        ```sh
        POD=<your pod>
        kubectl logs "$POD" --timestamps > container.log
        kubectl get pod "$POD" -o json > pod.json
        kubectl get events --field-selector involvedObject.name="$POD" -o json > events.json
        ```

        Redact them by hand, as the README's "Please send a capture" section describes:
        replace secret values (`HF_TOKEN`, API keys, `--api-key`, passwords) with `REDACTED`;
        replace names only if you must, the same way everywhere; never change a timestamp,
        reorder lines or delete log lines. Attach the three files (rename to `.txt` if GitHub
        refuses a file type).
  - type: input
    id: engine
    attributes:
      label: Engine
      placeholder: "vLLM, SGLang, llama.cpp, Ollama, ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Engine version and image
      description: The version the engine prints at startup, and the image (tag or digest).
      placeholder: "0.33.1, vllm/vllm-openai@sha256:..."
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: GPU model and count, or CPU.
      placeholder: "2x H100 80GB"
    validations:
      required: false
  - type: textarea
    id: bundle
    attributes:
      label: The capture
      description: Drag the zipped `capture` directory here, or the three kubectl files.
    validations:
      required: true
  - type: textarea
    id: redactions
    attributes:
      label: What you removed or renamed by hand
      description: Anything you changed in addition to what `capture` removed (its `SOURCE.md` lists that), so we know what is original. "Nothing" is a fine answer.
      placeholder: "Nothing beyond capture. / Replaced a password the server echoes on log line 12 with REDACTED."
    validations:
      required: true
  - type: input
    id: log-level
    attributes:
      label: Log level or verbosity flags
      description: Any flag or variable that changes how much the engine logs, or "defaults". Some lines only appear at a higher level (llama.cpp prints its build and KV cache only at `-lv 4`).
      placeholder: "-lv 4, or defaults"
    validations:
      required: true
